<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAWL FIGHTERS</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f7f7ff; background: radial-gradient(circle at 50% 0%, #343078, #111326 58%, #090b16); }
    main { width: min(100%, 560px); padding: 30px; border: 2px solid #7774d8; border-radius: 22px; background: #171a35ee; box-shadow: 0 18px 60px #0008; }
    h1 { margin: 0; text-align: center; letter-spacing: .08em; font-size: clamp(2rem, 8vw, 3.2rem); color: #ffe36e; text-shadow: 3px 3px #9b4e32; }
    .subtitle { text-align: center; color: #b9b9df; margin: 6px 0 26px; }
    h2 { font-size: 1.05rem; margin: 22px 0 10px; color: #aeadff; }
    button, input { width: 100%; min-height: 48px; border-radius: 12px; font: inherit; }
    button { border: 0; margin: 6px 0; padding: 12px 16px; font-weight: 800; cursor: pointer; color: #17152b; background: #ffe36e; }
    button.secondary { color: #fff; background: #5553a6; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input { padding: 12px; border: 2px solid #5553a6; outline: none; color: white; background: #0d1025; text-align: center; text-transform: uppercase; letter-spacing: .18em; }
    .join-row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
    .join-row button { margin: 0; }
    #status { margin-top: 20px; padding: 14px; min-height: 54px; border-radius: 12px; text-align: center; color: #d7d6ff; background: #0d1025; }
    #roomInfo { display: none; margin-top: 14px; padding: 18px; text-align: center; border: 1px dashed #ffe36e; border-radius: 14px; }
    #roomCode { display: block; font-size: 2rem; font-weight: 900; letter-spacing: .2em; color: #ffe36e; margin: 8px; }
    .small { color: #aaaed0; font-size: .86rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>BRAWL FIGHTERS</h1>
    <p class="subtitle">PIXEL-ART ONLINE BATTLE</p>

    <h2>⚔️ ランダムマッチ</h2>
    <button id="matchButton">対戦相手を探す</button>
    <button id="cancelButton" class="secondary" disabled>マッチングをキャンセル</button>

    <h2>🚪 ルーム対戦</h2>
    <button id="createButton" class="secondary">ルームを作成する</button>
    <div class="join-row">
      <input id="roomInput" maxlength="5" placeholder="ルーム番号" aria-label="ルーム番号">
      <button id="joinButton">参加</button>
    </div>

    <div id="roomInfo">
      <div>あなたのルーム番号</div>
      <strong id="roomCode">-----</strong>
      <p class="small">この番号を対戦相手に共有してください。</p>
      <button id="leaveButton" class="secondary">ルームを退出</button>
    </div>

    <div id="status" role="status" aria-live="polite">サーバーに接続しています...</div>
    <p class="small">オンラインロビー試作版です。対戦画面・キャラクター操作は次の開発段階で追加します。</p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusBox = document.getElementById("status");
    const matchButton = document.getElementById("matchButton");
    const cancelButton = document.getElementById("cancelButton");
    const createButton = document.getElementById("createButton");
    const joinButton = document.getElementById("joinButton");
    const roomInput = document.getElementById("roomInput");
    const roomInfo = document.getElementById("roomInfo");
    const roomCode = document.getElementById("roomCode");

    function status(message) { statusBox.textContent = message; }
    function showRoom(code) {
      roomCode.textContent = code;
      roomInfo.style.display = "block";
    }
    function resetRoom() {
      roomInfo.style.display = "none";
      cancelButton.disabled = true;
      matchButton.disabled = false;
    }

    socket.on("connect", () => status("サーバーに接続しました！対戦方法を選んでください。"));
    socket.on("connect_error", () => status("サーバーに接続できません。少し待って再読み込みしてください。"));
    socket.on("server:ready", () => {});
    socket.on("matchmaking:searching", () => {
      status("対戦相手を探しています...");
      cancelButton.disabled = false;
      matchButton.disabled = true;
    });
    socket.on("matchmaking:cancelled", () => {
      status("マッチングをキャンセルしました。");
      resetRoom();
    });
    socket.on("matchmaking:found", ({ roomCode: code }) => {
      status("対戦相手が見つかりました！");
      showRoom(code);
      cancelButton.disabled = true;
    });
    socket.on("room:created", ({ roomCode: code }) => {
      status("ルームを作成しました。相手の参加を待っています。");
      showRoom(code);
    });
    socket.on("room:joined", ({ roomCode: code, playerNumber }) => {
      showRoom(code);
      status("ルームに参加しました！（プレイヤー " + playerNumber + "）");
    });
    socket.on("room:waiting", () => status("相手が退出しました。もう一人の参加を待っています。"));
    socket.on("room:opponent-left", () => status("対戦相手が退出しました。"));
    socket.on("room:error", ({ message }) => status(message));
    socket.on("game:ready", () => status("2人そろいました！対戦画面は次の段階で接続します。"));

    matchButton.addEventListener("click", () => socket.emit("matchmaking:join"));
    cancelButton.addEventListener("click", () => socket.emit("matchmaking:cancel"));
    createButton.addEventListener("click", () => socket.emit("room:create"));
    joinButton.addEventListener("click", () => {
      const code = roomInput.value.trim().toUpperCase();
      if (code.length !== 5) return status("5文字のルーム番号を入力してください。");
      socket.emit("room:join", code);
    });
    document.getElementById("leaveButton").addEventListener("click", () => {
      socket.emit("room:leave");
      resetRoom();
      status("ルームを退出しました。");
    });
    roomInput.addEventListener("input", () => {
      roomInput.value = roomInput.value.replace(/[^A-Za-z2-9]/g, "").toUpperCase().slice(0, 5);
    });
  </script>
</body>
</html>
