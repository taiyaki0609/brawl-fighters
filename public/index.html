<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAWL FIGHTERS</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 50% 0%,#393477,#111326 65%,#090b16);padding:20px}
main{width:min(100%,900px);margin:0 auto}.panel{padding:24px;border:2px solid #7774d8;border-radius:20px;background:#171a35ee;box-shadow:0 16px 50px #0007}
h1{text-align:center;color:#ffe36e;font-size:clamp(2rem,7vw,3.5rem);margin:4px;text-shadow:3px 3px #9b4e32;letter-spacing:.08em}
.sub{text-align:center;color:#c3c2e8;margin:4px 0 24px}h2{color:#b9b7ff;font-size:1.1rem}
button,input,select{font:inherit;border-radius:11px;min-height:46px;padding:10px 14px}
button{border:0;background:#ffe36e;color:#17152b;font-weight:800;cursor:pointer;margin:5px}
button.secondary{background:#5553a6;color:white}button:disabled{opacity:.5}
input,select{background:#0d1025;color:white;border:2px solid #5553a6}
.wide{width:100%}.join{display:grid;grid-template-columns:1fr 110px;gap:8px}.join button{margin:0}
#status{padding:14px;margin-top:18px;text-align:center;background:#0d1025;border-radius:12px;color:#ddd}
#roomInfo{display:none;text-align:center;margin:14px;padding:12px;border:1px dashed #ffe36e;border-radius:12px}
#roomCode{font-size:2rem;color:#ffe36e;letter-spacing:.2em}
#game{display:none}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#arena{display:block;width:100%;aspect-ratio:16/9;background:#161b3b;border:4px solid #7774d8;border-radius:14px;image-rendering:pixelated}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.hpwrap{height:15px;background:#333;border:2px solid #aaa;border-radius:8px;overflow:hidden}.hp{height:100%;width:100%;background:#62e58b}
.playerlabel{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin-bottom:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:12px 0}
.controls button{min-width:62px;touch-action:none}
.note{color:#b9b9d8;font-size:.85rem;line-height:1.6;text-align:center}
@media(max-width:560px){body{padding:8px}.panel{padding:14px}.controls button{flex:1}.topbar{justify-content:center}}
</style></head>
<body><main>
<section id="lobby" class="panel">
<h1>BRAWL FIGHTERS</h1><p class="sub">PIXEL-ART ONLINE BATTLE</p>
<h2>⚔️ ランダムマッチ</h2><button id="matchButton" class="wide">対戦相手を探す</button><button id="cancelButton" class="wide secondary" disabled>マッチングをキャンセル</button>
<h2>🚪 ルーム対戦</h2><button id="createButton" class="wide secondary">ルームを作成する</button>
<div class="join"><input id="roomInput" maxlength="5" placeholder="ルーム番号" aria-label="ルーム番号"><button id="joinButton">参加</button></div>
<div id="roomInfo">あなたのルーム番号<strong id="roomCode">-----</strong><button id="leaveButton" class="secondary">ルームを退出</button></div>
<div id="status" role="status" aria-live="polite">サーバーに接続しています...</div>
<p class="note">2人で遊べるオンライン対戦ゲーム。対戦画面は開発中です。</p>
</section>
<section id="game" class="panel">
<div class="topbar"><strong style="color:#ffe36e">BRAWL FIGHTERS</strong><span id="playerInfo">PLAYER 1</span><button id="backButton" class="secondary">ロビーへ戻る</button></div>
<h2 style="text-align:center">BRAWL ARENA</h2>
<div class="hud"><div><div class="playerlabel"><span>YOU</span><span id="youName">SURGE</span></div><div class="hpwrap"><div class="hp" id="youHp"></div></div></div><div><div class="playerlabel"><span>OPPONENT</span><span id="opName">SURGE</span></div><div class="hpwrap"><div class="hp" id="opHp"></div></div></div></div>
<canvas id="arena" width="960" height="540" aria-label="対戦ステージ"></canvas>
<div class="controls"><label>キャラクター <select id="character"><option value="SURGE">サージ</option><option value="SHELLY">シェリー</option><option value="SPIKE">スパイク</option><option value="CROW">クロウ</option></select></label></div>
<div class="controls"><button id="left">◀ 左</button><button id="right">右 ▶</button><button id="jump">2段ジャンプ</button></div>
<div class="controls attack-controls"><button id="quickAttack">通常攻撃 [F]</button><button id="strongAttack" class="secondary">強攻撃 [G]</button><button id="specialAttack" style="background:#ff8b4a">必殺技 [H]</button></div>
<p class="note">キーボード：A / D または ← / → で移動、W / ↑ / Space で2段ジャンプ、F＝通常攻撃・G＝強攻撃・H＝必殺技。スマホ・タブレットは攻撃ボタンを使用できます。</p>
<div id="gameStatus" class="note">対戦相手と接続中...</div>
</section></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();const $=id=>document.getElementById(id);
let roomCode=null,playerNumber=1,gameActive=false,lastSend=0;
const me={x:.22,y:0,vy:0,jumpCount:0,facing:1,action:"idle",character:"SURGE",attackUntil:0,attackType:"quick",attackSeq:0};
const opponent={x:.78,y:0,facing:-1,action:"idle",character:"SURGE",attackType:"quick",attackSeq:0};
const attackEffects=[];
let quickHeld=false,nextQuickAt=0;
const colors={SURGE:"#42d9f5",SHELLY:"#bd79ff",SPIKE:"#72e36d",CROW:"#c4e7ff"};
function status(t){$("status").textContent=t}
function showRoom(c){roomCode=c;$("roomCode").textContent=c;$("roomInfo").style.display="block"}
function resetLobby(){ $("roomInfo").style.display="none";$("cancelButton").disabled=true;$("matchButton").disabled=false}
function enterGame(){gameActive=true;$("lobby").style.display="none";$("game").style.display="block";$("playerInfo").textContent="PLAYER "+playerNumber;$("gameStatus").textContent="対戦開始！相手と操作を同期しています。";draw()}
function leaveGame(){gameActive=false;socket.emit("room:leave");$("game").style.display="none";$("lobby").style.display="block";resetLobby();status("ロビーに戻りました。")}
socket.on("connect",()=>status("サーバーに接続しました！対戦方法を選んでください。"));
socket.on("connect_error",()=>status("サーバーに接続できません。再読み込みしてください。"));
socket.on("matchmaking:searching",()=>{status("対戦相手を探しています...");$("cancelButton").disabled=false;$("matchButton").disabled=true});
socket.on("matchmaking:cancelled",()=>{status("マッチングをキャンセルしました。");resetLobby()});
socket.on("matchmaking:found",d=>{showRoom(d.roomCode);status("対戦相手が見つかりました！")});
socket.on("room:created",d=>{showRoom(d.roomCode);status("ルームを作成しました。相手を待っています。")});
socket.on("room:joined",d=>{playerNumber=d.playerNumber;showRoom(d.roomCode);status("ルームに参加しました！（プレイヤー "+playerNumber+"）")});
socket.on("room:waiting",()=>{if(gameActive){$("gameStatus").textContent="相手が退出しました。";}else status("相手が退出しました。もう一人の参加を待っています。")});
socket.on("room:opponent-left",()=>{$("gameStatus").textContent="対戦相手が退出しました。"});
socket.on("room:error",d=>status(d.message));
socket.on("game:ready",()=>{enterGame();});
socket.on("game:opponent-state",s=>{opponent.x=s.x;opponent.y=s.y;opponent.facing=s.facing;opponent.action=s.action;opponent.character=s.character;opponent.attackType=s.attackType||"quick";if(s.attackSeq!==opponent.attackSeq){opponent.attackSeq=s.attackSeq;spawnAttackEffect(opponent.x*960,435-opponent.y*360,opponent.facing,opponent.attackType,opponent.character)}$("opName").textContent=s.character;});
$("matchButton").onclick=()=>socket.emit("matchmaking:join");
$("cancelButton").onclick=()=>socket.emit("matchmaking:cancel");
$("createButton").onclick=()=>socket.emit("room:create");
$("joinButton").onclick=()=>{let c=$("roomInput").value.trim().toUpperCase();if(c.length!==5)return status("5文字のルーム番号を入力してください。");socket.emit("room:join",c)};
$("leaveButton").onclick=()=>{socket.emit("room:leave");resetLobby();status("ルームを退出しました。")};
$("roomInput").oninput=()=>{$("roomInput").value=$("roomInput").value.replace(/[^A-Za-z2-9]/g,"").toUpperCase().slice(0,5)};
$("backButton").onclick=leaveGame;
$("character").onchange=()=>{me.character=$("character").value;$("youName").textContent=me.character};
const heldDirections=new Set();
function act(a){if(!gameActive)return;if(a==="jump"&&me.jumpCount<2){me.vy=me.jumpCount===0?.30:.25;me.jumpCount++;me.action="jump"}if(["quick","strong","special"].includes(a)){const now=performance.now();if(a==="strong"&&now<(me.strongReady||0))return;if(a==="special"&&now<(me.specialReady||0))return;if(a==="strong")me.strongReady=now+650;if(a==="special")me.specialReady=now+1100;me.action="attack";me.attackType=a;me.attackSeq++;me.attackUntil=now+(a==="quick"?210:a==="strong"?430:560);spawnAttackEffect(me.x*960,435-me.y*360,me.facing,a,me.character);if(a==="quick")nextQuickAt=now+240}draw()}
function holdDirection(direction,on){if(on){heldDirections.add(direction);me.facing=direction==="left"?-1:1}else heldDirections.delete(direction)}
$("left").onpointerdown=e=>{e.preventDefault();$("left").setPointerCapture?.(e.pointerId);holdDirection("left",true)};
$("right").onpointerdown=e=>{e.preventDefault();$("right").setPointerCapture?.(e.pointerId);holdDirection("right",true)};
for(const id of ["left","right"]){$(id).onpointerup=$(id).onpointercancel=$(id).onlostpointercapture=()=>holdDirection(id,false)}
window.addEventListener("pointerup",()=>{heldDirections.clear();quickHeld=false});
$("jump").onpointerdown=e=>{e.preventDefault();act("jump")};$("quickAttack").onpointerdown=e=>{e.preventDefault();if(!quickHeld){quickHeld=true;act("quick")}};$("quickAttack").onpointerup=$("quickAttack").onpointercancel=$("quickAttack").onlostpointercapture=()=>{quickHeld=false};$("strongAttack").onpointerdown=e=>{e.preventDefault();act("strong")};$("specialAttack").onpointerdown=e=>{e.preventDefault();act("special")};
window.addEventListener("keydown",e=>{let k=e.key.toLowerCase();if(["arrowleft","arrowright","arrowup"," "].includes(k))e.preventDefault();if(k==="a"||k==="arrowleft")holdDirection("left",true);if(k==="d"||k==="arrowright")holdDirection("right",true);if(k==="w"||k==="arrowup"||k===" ")act("jump");if((k==="f"||k==="enter")&&!quickHeld){quickHeld=true;act("quick")}if(k==="g")act("strong");if(k==="h")act("special")});
window.addEventListener("keyup",e=>{let k=e.key.toLowerCase();if(k==="a"||k==="arrowleft")holdDirection("left",false);if(k==="d"||k==="arrowright")holdDirection("right",false);if(k==="f"||k==="enter")quickHeld=false});
window.addEventListener("blur",()=>heldDirections.clear());
function pixel(ctx,x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function fighter(ctx,x,y,face,color,action,label,character){
 const now=performance.now()/1000;
 const moving=action==="walk",jumping=action==="jump"||y<430,attacking=action==="attack";
 const run=Math.sin(now*13),idle=Math.sin(now*3)*1.5;
 const bob=jumping?-5: moving?Math.abs(run)*2:idle;
 const legSwing=moving?run*8:jumping?-7:0;
 const armSwing=moving?-run*6:0;
 ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(face,1);
 // shadow
 ctx.globalAlpha=jumping?.12:.3;
 ctx.fillStyle="#050817";ctx.beginPath();ctx.ellipse(0,5,jumping?18:34,jumping?5:8,0,0,Math.PI*2);ctx.fill();
 ctx.globalAlpha=1;
 // palette and pixel-outline helper
 const dark="#11172d",ink="#090e20",gold="#ffd45d",white="#fff4d1";
 const p=(a,b,w,h,c)=>pixel(ctx,a,b,w,h,c);
 // legs: layered boots with animated stride
 p(-22+legSwing,-31+bob,17,25,dark);p(7-legSwing,-31+bob,17,25,dark);
 p(-25+legSwing,-13+bob,22,11,character==="CROW"?"#dcecff":"#f2c45b");
 p(5-legSwing,-13+bob,22,11,character==="CROW"?"#dcecff":"#f2c45b");
 p(-23+legSwing,-15+bob,17,4,"#fff0a0");p(7-legSwing,-15+bob,17,4,"#fff0a0");
 // body silhouette and armor layers
 p(-31,-83+bob,62,57,ink);p(-27,-81+bob,54,51,dark);
 p(-24,-78+bob,48,42,color);p(-20,-74+bob,40,31,"#ffffff20");
 p(-29,-48+bob,58,12,dark);p(-24,-47+bob,48,7,gold);
 p(-10,-43+bob,20,8,ink);
 // character-specific torso and head
 if(character==="SURGE"){
   p(-30,-119+bob,60,39,"#1b2c54");p(-25,-116+bob,50,32,"#38cce8");
   p(-22,-112+bob,44,21,"#20345c");p(-17,-108+bob,12,10,"#f4fbff");p(5,-108+bob,12,10,"#f4fbff");
   p(-13,-105+bob,6,6,"#14213c");p(9,-105+bob,6,6,"#14213c");
   p(-8,-91+bob,16,5,"#f3a84b");p(-34,-103+bob,8,22,gold);p(26,-103+bob,8,22,gold);
   p(-23,-82+bob,46,7,"#18345d");p(-17,-75+bob,34,6,"#8df4ff");
   p(-33,-76+bob,12,28,"#20b9df");p(21,-76+bob,12,28,"#20b9df");
   p(-25,-68+bob,9,8,"#a4f7ff");p(16,-68+bob,9,8,"#a4f7ff");
 }else if(character==="SHELLY"){
   p(-28,-120+bob,56,37,"#e8b28f");p(-31,-124+bob,62,17,"#63328d");
   p(-32,-116+bob,14,28,"#7d43a6");p(18,-116+bob,14,28,"#7d43a6");
   p(-24,-121+bob,13,8,"#b878cf");p(12,-121+bob,13,8,"#b878cf");
   p(-17,-109+bob,11,8,"#fff1dc");p(7,-109+bob,11,8,"#fff1dc");
   p(-14,-107+bob,6,6,"#30233c");p(8,-107+bob,6,6,"#30233c");
   p(-8,-96+bob,17,5,"#a64d62");p(-25,-88+bob,50,9,"#f6d7ed");
   p(-20,-79+bob,40,8,"#63328d");p(-8,-72+bob,16,6,"#e7b5ec");
   p(23,-81+bob,16,25,"#5a3986");p(34,-86+bob,10,35,"#cbd5e8");p(37,-91+bob,7,8,gold);
 }else if(character==="SPIKE"){
   p(-27,-118+bob,54,37,"#579d4d");p(-23,-125+bob,12,13,"#9ce56b");p(11,-125+bob,12,13,"#9ce56b");
   p(-34,-112+bob,12,16,"#8bd95d");p(22,-112+bob,12,16,"#8bd95d");
   p(-18,-109+bob,11,10,"#fff0c5");p(7,-109+bob,11,10,"#fff0c5");
   p(-15,-107+bob,6,7,"#202b35");p(9,-107+bob,6,7,"#202b35");
   p(-6,-97+bob,13,5,"#284832");p(-23,-88+bob,46,10,"#315d3d");
   p(-28,-81+bob,12,25,"#74cb5c");p(16,-81+bob,12,25,"#74cb5c");
   p(-34,-72+bob,8,11,"#b5ed72");p(26,-72+bob,8,11,"#b5ed72");
   p(-20,-68+bob,40,7,"#315d3d");
 }else{
   p(-29,-120+bob,58,38,"#26364f");p(-33,-116+bob,66,19,"#101c32");
   p(-23,-112+bob,46,15,"#d9efff");p(-18,-109+bob,13,9,"#fff");
   p(6,-109+bob,13,9,"#fff");p(-14,-107+bob,7,7,"#152238");p(8,-107+bob,7,7,"#152238");
   p(-9,-96+bob,19,5,"#111a2c");p(-25,-88+bob,50,9,"#16263f");
   p(-30,-80+bob,14,28,"#b7e3ff");p(16,-80+bob,14,28,"#b7e3ff");
   p(-35,-73+bob,8,13,"#e8f8ff");p(27,-73+bob,8,13,"#e8f8ff");
   p(-22,-68+bob,44,7,"#17263d");p(-17,-63+bob,34,5,"#8bb9db");
 }
 // unmistakable Brawl Stars-inspired character signatures
 if(character==="SURGE"){
   // Surge's oversized visor helmet, yellow side fins and chest reactor
   p(-35,-126+bob,70,8,"#16284d");p(-39,-116+bob,9,22,gold);p(30,-116+bob,9,22,gold);
   p(-15,-111+bob,30,5,"#b9fbff");p(-9,-52+bob,18,12,"#ffe36e");p(-5,-49+bob,10,6,"#36d8f2");
 }else if(character==="SHELLY"){
   // Shelly's purple hair, headband and recognizable shotgun
   p(-31,-126+bob,62,9,"#4b2676");p(-34,-118+bob,12,23,"#713a9d");p(22,-118+bob,12,23,"#713a9d");
   p(-22,-124+bob,44,6,"#f0b4df");p(-10,-92+bob,20,5,"#8c435d");
   p(27,-73+bob,27,12,"#6c7189");p(48,-76+bob,8,18,"#cbd3e7");p(55,-72+bob,6,8,"#f4d36d");
 }else if(character==="SPIKE"){
   // Spike's round cactus head and visible green spikes
   p(-36,-113+bob,8,13,"#a9ee72");p(28,-113+bob,8,13,"#a9ee72");
   p(-20,-130+bob,9,10,"#a9ee72");p(-4,-133+bob,9,12,"#b8f47b");p(13,-130+bob,9,10,"#a9ee72");
   p(-7,-91+bob,14,8,"#315d3d");p(-30,-63+bob,7,8,"#b8f47b");p(23,-63+bob,7,8,"#b8f47b");
 }else if(character==="CROW"){
   // Crow's dark bird hood, sharp beak and feather crest
   p(-30,-127+bob,60,10,"#101b32");p(-22,-135+bob,13,12,"#263c5b");p(-5,-139+bob,13,15,"#263c5b");p(12,-133+bob,12,11,"#263c5b");
   ctx.fillStyle="#e8c75b";ctx.beginPath();ctx.moveTo(14,-105+bob);ctx.lineTo(34,-100+bob);ctx.lineTo(14,-94+bob);ctx.closePath();ctx.fill();
   p(-24,-88+bob,48,7,"#182b46");p(-27,-65+bob,8,12,"#d9efff");p(19,-65+bob,8,12,"#d9efff");
 }
 // shoulders and animated arms
 if(attacking){
   p(20,-83+bob,17,20,dark);p(29,-81+bob,28,13,color);
   p(50,-86+bob,17,22,gold);p(59,-91+bob,9,8,white);
   p(70,-91+bob,7,7,"#9ff5ff");p(76,-82+bob,5,5,"#fff");
 }else{
   p(-39,-82+bob,17,25,dark);p(22,-82+bob,17,25,dark);
   p(-38,-78+bob+armSwing,14,25,color);p(24,-78+bob-armSwing,14,25,color);
   p(-40,-57+bob+armSwing,18,13,gold);p(22,-57+bob-armSwing,18,13,gold);
   p(-39,-58+bob+armSwing,10,4,white);p(29,-58+bob-armSwing,9,4,white);
 }
 // bright pixel highlights and outline accents
 p(-25,-80+bob,7,4,"#ffffff88");p(18,-80+bob,6,4,"#ffffff66");
 p(-29,-36+bob,58,4,"#ffffff33");
 ctx.restore();
 ctx.fillStyle="#fff";ctx.font="bold 17px system-ui";ctx.textAlign="center";
 ctx.shadowColor="#050817";ctx.shadowBlur=5;ctx.fillText(label,x,y-143);ctx.shadowBlur=0;
}
function spawnAttackEffect(x,y,facing,type,character){
 const palette={SURGE:"#45eaff",SHELLY:"#ffb5e8",SPIKE:"#a8f56b",CROW:"#d8efff"};
 const color=palette[character]||"#ffffff";
 const add=(shape,angle,speed,radius,life,extra={})=>attackEffects.push({x:x+facing*43,y:y-83,vx:Math.cos(angle)*speed*facing,vy:Math.sin(angle)*speed,life,max:life,radius,color,shape,...extra});
 if(type==="special"){
  attackEffects.push({x:x+facing*65,y:y-82,vx:0,vy:0,life:38,max:38,radius:18,color:"#fff3a1",shape:"shockwave",character});
  for(let i=0;i<22;i++)add(character==="SPIKE"?"thorn":"orb",Math.PI*2*i/22,3.5+Math.random()*3,character==="SURGE"?9:7,32,{color:i%3===0?"#ffffff":color});
  return;
 }
 if(type==="strong"){
  add("orb",0,7,19,36,{color:"#fff0a6",charged:true});
  for(let i=0;i<10;i++)add("spark",-.65+i*.13,5+Math.random()*2,4,22,{color});
  return;
 }
 if(character==="SHELLY"){
  for(let i=0;i<5;i++)add("pellet",-.25+i*.125,9,5,17,{color:i===2?"#fff5d7":color});
 }else if(character==="SPIKE"){
  add("thorn",0,7.2,10,28,{color});
  for(let i=0;i<4;i++)add("spark",-.28+i*.18,4,3,16,{color:"#d9ff9c"});
 }else if(character==="CROW"){
  for(let i=0;i<3;i++)add("feather",-.18+i*.18,8.5,8,24,{color});
 }else{
  add("orb",0,8.5,11,27,{color,charged:true});
  for(let i=0;i<5;i++)add("spark",-.35+i*.14,5,3,16,{color:"#bafaff"});
 }
}
function drawAttackEffects(ctx){
 for(let i=attackEffects.length-1;i>=0;i--){
  const e=attackEffects[i];e.x+=e.vx;e.y+=e.vy;e.vy+=e.shape==="shockwave"?0:.012;e.life--;
  if(e.life<=0){attackEffects.splice(i,1);continue}
  const alpha=e.life/e.max;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=e.color;ctx.shadowBlur=e.shape==="shockwave"?18:14;
  if(e.shape==="shockwave"){
   const progress=1-alpha;ctx.strokeStyle=e.color;ctx.lineWidth=7*alpha;ctx.beginPath();ctx.arc(e.x,e.y,18+progress*105,0,Math.PI*2);ctx.stroke();
   ctx.strokeStyle="#ffffff";ctx.lineWidth=2*alpha;ctx.beginPath();ctx.arc(e.x,e.y,10+progress*78,0,Math.PI*2);ctx.stroke();
  }else if(e.shape==="orb"||e.shape==="pellet"){
   ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.radius*(.7+.3*alpha),0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(e.x-e.radius*.3,e.y-e.radius*.3,Math.max(2,e.radius*.3),0,Math.PI*2);ctx.fill();
